<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beyond Words — Speaking Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#F4F5F2; --stone-2:#ECEEE9; --surface:#FFFFFF;
  --line:#E3E5DF; --line-2:#D3D6CD;
  --ink:#1B1D1A; --ink-2:#5C5F57; --ink-3:#8A8D83;
  --accent:#0F5D57; --accent-press:#0A4A45; --accent-tint:#E4F0EE; --accent-tint-2:#D3E7E4;
  --good:#0F5D57; --warn:#9A6b1f; --danger:#9E3B2E;
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(27,29,26,.04), 0 6px 22px -12px rgba(27,29,26,.14);
  --shadow-lg:0 2px 4px rgba(27,29,26,.05), 0 24px 60px -28px rgba(27,29,26,.28);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--stone);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100dvh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
textarea,input{font-family:inherit}
::selection{background:var(--accent-tint-2)}

.app{max-width:660px;margin:0 auto;padding:26px 20px 96px;min-height:100dvh;position:relative}
.screen{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:flex;align-items:flex-end;gap:2.5px;height:18px}
.mark span{width:2.5px;background:var(--accent);border-radius:2px;display:block}
.mark span:nth-child(1){height:7px}.mark span:nth-child(2){height:14px}
.mark span:nth-child(3){height:18px}.mark span:nth-child(4){height:10px}.mark span:nth-child(5){height:5px}
.brand b{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.brand small{color:var(--ink-3);font-size:12px;font-weight:500}
.ghostlink{color:var(--ink-2);font-size:13px;font-weight:500;padding:7px 10px;border-radius:9px}
.ghostlink:hover{background:var(--stone-2);color:var(--ink)}

.eyebrow{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}

.greeting{font-family:var(--serif);font-size:clamp(30px,7vw,42px);line-height:1.08;letter-spacing:-.02em;margin:14px 0 4px;font-weight:400}
.greeting .name{font-style:italic}
.editname{border-bottom:1px dashed var(--line-2);color:inherit;font:inherit;background:none;padding:0 1px}
.subhead{color:var(--ink-2);font-size:16px;margin:0 0 30px}

.choices{display:grid;gap:14px}
.choice{display:flex;align-items:center;gap:18px;text-align:left;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px;box-shadow:var(--shadow);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.choice:active{transform:translateY(0)}
.choice .ic{flex:0 0 46px;height:46px;border-radius:12px;background:var(--accent-tint);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.choice h3{margin:0 0 3px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.choice p{margin:0;color:var(--ink-2);font-size:13.5px}
.choice .arr{margin-left:auto;color:var(--ink-3);transition:transform .18s ease}
.choice:hover .arr{transform:translateX(3px);color:var(--accent)}

.week{margin-top:32px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.week-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.week-top .eyebrow{margin:0}
.week-stats{display:flex;gap:18px;color:var(--ink-2);font-size:12.5px}
.week-stats b{color:var(--ink);font-family:var(--mono);font-weight:600}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line-2);position:relative}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.today{box-shadow:0 0 0 3px var(--accent-tint)}
.dot .d{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3);font-weight:500}
.dotrow{padding-bottom:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13.5px;font-weight:500;margin-bottom:22px;padding:6px 10px 6px 6px;border-radius:9px}
.back:hover{background:var(--stone-2);color:var(--ink)}

.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 20px}
@media(max-width:520px){.goalgrid{grid-template-columns:1fr}}
.goal{display:flex;align-items:center;gap:11px;padding:14px 15px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);text-align:left;font-size:14px;font-weight:500;transition:border-color .15s ease,background .15s ease}
.goal:hover{border-color:var(--line-2);background:#fbfcfa}
.goal.sel{border-color:var(--accent);background:var(--accent-tint);color:var(--accent)}
.goal .gk{flex:0 0 8px;height:8px;border-radius:50%;background:var(--line-2)}
.goal.sel .gk{background:var(--accent)}
.field{margin-top:6px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--ink)}
textarea.own{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--surface)}
textarea.own:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.timechips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tchip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;font-family:var(--mono);background:var(--surface)}
.tchip.sel{border-color:var(--accent);background:var(--accent);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;padding:14px 22px;border-radius:12px;width:100%;transition:background .16s ease,transform .12s ease;box-shadow:0 1px 2px rgba(15,93,87,.25)}
.btn:hover{background:var(--accent-press)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--line-2);color:#fff;box-shadow:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.btn.sec:hover{background:var(--stone-2)}
.btn.slim{width:auto;padding:11px 18px;font-size:14px}
.btnrow{display:flex;gap:10px;margin-top:22px}
.btnrow .btn{width:auto;flex:1}

.promptcard{position:relative;padding:28px 26px}
.promptcard .eyebrow{margin-bottom:14px}
.topic{font-family:var(--serif);font-size:clamp(22px,4.6vw,28px);line-height:1.25;letter-spacing:-.01em;margin:0}
.reroll{position:absolute;top:20px;right:20px;color:var(--ink-3);padding:8px;border-radius:9px}
.reroll:hover{background:var(--stone-2);color:var(--accent)}
.reroll.spin svg{animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}

.fw{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.fw-head{display:flex;align-items:center;gap:12px;padding:16px 18px;width:100%;text-align:left}
.fw-head:hover{background:#fbfcfa}
.fw-tag{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent);background:var(--accent-tint);padding:4px 8px;border-radius:6px}
.fw-head h4{margin:0;font-size:14px;font-weight:600}
.fw-head p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.fw-head .chev{margin-left:auto;color:var(--ink-3);transition:transform .2s ease}
.fw-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fw-body{padding:0 18px 18px;border-top:1px solid var(--line)}
.fw-steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
.fw-step{font-size:12.5px;color:var(--ink-2)}
.fw-step b{color:var(--ink);font-weight:600}
.fw-step:not(:last-child)::after{content:"→";margin-left:6px;color:var(--line-2)}
.fw-ex{font-family:var(--serif);font-size:15px;line-height:1.5;color:var(--ink-2);font-style:italic;border-left:2px solid var(--accent-tint-2);padding-left:14px;margin:0 0 12px}
.fw-note{font-size:12px;color:var(--ink-3)}
.fw-alt{font-size:12.5px;color:var(--ink-2);margin-top:12px;text-align:center}
.fw-alt button{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.optional{display:inline-block;font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;font-weight:500}

.rec-wrap{text-align:center;padding:16px 0 4px}
.rec-topic{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink);max-width:480px;margin:0 auto 4px}
.rec-target{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:26px}
.wave{height:88px;display:flex;align-items:center;justify-content:center;gap:3px;margin:0 auto 6px;max-width:360px}
.wave i{width:3px;min-height:3px;background:var(--accent);border-radius:3px;opacity:.85;transition:height .08s linear}
.wave.idle i{background:var(--line-2)}
.timer{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.01em;margin:2px 0 4px}
.timer.over{color:var(--danger)}
.timer-sub{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:26px}
.recbtn{width:76px;height:76px;border-radius:50%;background:var(--accent);margin:0 auto;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px -6px rgba(15,93,87,.6);transition:transform .15s ease}
.recbtn:hover{transform:scale(1.04)}
.recbtn:active{transform:scale(.97)}
.recbtn.disabled{background:var(--line-2);box-shadow:none;cursor:not-allowed}
.recbtn.disabled:hover{transform:none}
.recbtn .glyph{width:26px;height:26px;border-radius:50%;background:#fff}
.recbtn.live{background:var(--danger);box-shadow:0 6px 20px -6px rgba(158,59,46,.6);animation:pulse 1.6s ease-in-out infinite}
.recbtn.live .glyph{border-radius:6px;width:24px;height:24px}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px -6px rgba(158,59,46,.55)}50%{box-shadow:0 6px 30px 2px rgba(158,59,46,.35)}}
.rec-hint{color:var(--ink-3);font-size:12.5px;margin-top:16px}
.inputsplit{display:flex;align-items:center;gap:14px;max-width:360px;margin:22px auto 0;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.inputsplit::before,.inputsplit::after{content:"";height:1px;flex:1;background:var(--line)}
.uploadwrap{max-width:360px;margin:16px auto 0}
.typelink{margin-top:14px}
.typelink button{font-size:12.5px;color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.typelink button:hover{color:var(--accent)}
.hiddenfile{display:none}
.capnote{max-width:400px;margin:14px auto 0;font-size:12px;color:var(--ink-3);line-height:1.5;background:#fbfcfa;border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:11px 13px;text-align:left;display:flex;gap:9px}
.capnote svg{flex:0 0 15px;margin-top:2px}

.tx-panel{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px 18px}
.tx-panel .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tx-src{font-family:var(--mono);font-size:10px;color:var(--ink-3);background:var(--stone-2);padding:2px 7px;border-radius:5px;text-transform:none;letter-spacing:0;font-weight:500}
textarea.tx{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;font-size:14px;line-height:1.55;color:var(--ink);background:#fbfcfa}
textarea.tx:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.tx-help{font-size:11.5px;color:var(--ink-3);margin-top:9px;line-height:1.5}
.tx-help code{font-family:var(--mono);font-size:11px;background:var(--stone-2);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
audio.player{width:100%;margin-top:10px;height:38px}

.analyzing{text-align:center;padding:70px 0}
.analyzing .wave{height:56px;margin-bottom:22px}
.analyzing .wave i{animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{height:8px}50%{height:34px}}
.analyzing .wave i:nth-child(2){animation-delay:.1s}.analyzing .wave i:nth-child(3){animation-delay:.2s}
.analyzing .wave i:nth-child(4){animation-delay:.3s}.analyzing .wave i:nth-child(5){animation-delay:.15s}
.analyzing .wave i:nth-child(6){animation-delay:.25s}.analyzing .wave i:nth-child(7){animation-delay:.05s}
.analyzing p{color:var(--ink-2);font-size:14.5px;font-family:var(--serif);font-style:italic}

.fb-head{margin-bottom:6px}
.fb-topic{color:var(--ink-2);font-size:13px;margin:3px 0 22px;line-height:1.4}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.metric{background:var(--surface);padding:16px 18px}
.metric .k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.metric .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1}
.metric .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.metric .sub{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.4}
.chiplab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;margin-top:4px}
.chiplab::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.lab-clear{background:var(--accent-tint);color:var(--accent)}
.lab-mostly{background:#F3EEDC;color:var(--warn)}
.lab-effort{background:#F6E6E2;color:var(--danger)}
.fillerlist{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:7px;line-height:1.5}

.block{padding:20px 0;border-top:1px solid var(--line)}
.block:first-of-type{border-top:none}
.block .eyebrow{margin-bottom:12px}
.worked{display:flex;flex-direction:column;gap:10px;margin:0;padding:0}
.worked li{display:flex;gap:11px;font-size:14.5px;color:var(--ink);line-height:1.5;list-style:none}
.worked li svg{flex:0 0 18px;margin-top:2px;color:var(--accent)}
.pattern{font-size:15px;line-height:1.6;color:var(--ink);margin:0}
.why{font-size:14px;line-height:1.6;color:var(--ink-2);margin:8px 0 0}
.focuscard{background:var(--accent-tint);border:1px solid var(--accent-tint-2);border-left:3px solid var(--accent);border-radius:var(--radius-sm);padding:18px 20px;margin-top:4px}
.focuscard .eyebrow{color:var(--accent);margin-bottom:8px}
.focuscard p{margin:0;font-size:16px;line-height:1.5;color:var(--ink);font-weight:500}
.tryagain{background:var(--stone-2);border-radius:var(--radius-sm);padding:16px 18px;margin-top:12px}
.tryagain .eyebrow{margin-bottom:7px}
.tryagain p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.coachnote{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:12.5px;color:var(--ink-3);line-height:1.5;background:#fbfcfa;border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:12px 14px}
.coachnote svg{flex:0 0 15px;margin-top:2px}

.prog{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
.progrow{background:var(--surface);display:flex;align-items:center;padding:15px 18px;gap:14px}
.progrow .pk{font-size:13px;font-weight:600;color:var(--ink-2);flex:0 0 84px}
.progrow .pv{font-family:var(--mono);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.progrow .pv .from{color:var(--ink-3)}
.progrow .pv .to{color:var(--ink)}
.progrow .pv .arr{color:var(--line-2)}
.progrow .tag{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.tag-up{background:var(--accent-tint);color:var(--accent)}
.tag-flat{background:var(--stone-2);color:var(--ink-3)}
.qualrow{background:var(--surface);padding:15px 18px}
.qualrow .pk{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.qualrow p{margin:0;font-size:14px;color:var(--ink);line-height:1.5}
.verdict{font-family:var(--serif);font-size:20px;line-height:1.35;color:var(--ink);margin:0 0 20px;font-weight:400}
.verdict em{color:var(--accent);font-style:italic}

.histlist{display:flex;flex-direction:column;gap:10px}
.histitem{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px 18px;box-shadow:var(--shadow)}
.histitem .date{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto}
.histitem .ht{font-size:13.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histitem .hm{font-family:var(--mono);font-size:12px;color:var(--ink-2);flex:0 0 auto}
.empty{text-align:center;padding:56px 20px;color:var(--ink-2)}
.empty .wave{height:40px;margin-bottom:18px;opacity:.5}
.empty h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0;font-size:14px}

.errbox{background:#F6E6E2;border:1px solid #E7CBC4;border-radius:var(--radius-sm);padding:14px 16px;font-size:13.5px;color:var(--danger);margin-top:14px;line-height:1.5}
.errbox b{font-weight:600}
.footnote{text-align:center;color:var(--ink-3);font-size:11px;margin-top:38px;line-height:1.5}
h2.scr-title{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.01em;margin:0 0 4px}
.scr-sub{color:var(--ink-2);font-size:14px;margin:0 0 22px}
.authwrap{max-width:460px;margin:9vh auto 0}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:28px}
.authcard h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.15;margin:14px 0 8px}
.authcard p{color:var(--ink-2);font-size:14px;margin:0 0 22px}
.authfield{margin-top:14px}
.authfield label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
.authfield input{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 13px;font-size:14.5px;background:#fff;color:var(--ink)}
.authfield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.authswitch{font-size:12.5px;color:var(--ink-2);text-align:center;margin-top:15px}
.authswitch button{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.authmsg{margin-top:14px;font-size:13px;color:var(--ink-2);background:#fbfcfa;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px}
</style>
</head>
<body>

const MicSupport = {

const MicRecorder = {
  mediaRecorder:null, chunks:[], stream:null, ctx:null, analyser:null, startedAt:0, _raf:0,
  async start(onLevel){
    this.stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    this.chunks = [];
    this.mediaRecorder = new MediaRecorder(this.stream);
    this.mediaRecorder.ondataavailable = e => { if(e.data.size) this.chunks.push(e.data); };
    this.mediaRecorder.start();
    this.startedAt = performance.now();
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      const src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 256;
      src.connect(this.analyser);
      const data = new Uint8Array(this.analyser.frequencyBinCount);
      const tick = () => { if(!this.analyser) return;
        this.analyser.getByteFrequencyData(data);
        let sum=0; for(let i=0;i<data.length;i++) sum+=data[i];
        onLevel && onLevel(Math.min(1,(sum/data.length)/90));
        this._raf = requestAnimationFrame(tick); };
      tick();
    }catch(e){}
  },
  async stop(){
    const durationMs = performance.now() - this.startedAt;
    const blob = await new Promise(res=>{
      if(!this.mediaRecorder){ res(null); return; }
      this.mediaRecorder.onstop = () => res(new Blob(this.chunks,{type:this.chunks[0]?.type||"audio/webm"}));
      this.mediaRecorder.stop();
    });
    cancelAnimationFrame(this._raf);
    if(this.ctx){ try{ this.ctx.close(); }catch(e){} this.ctx=null; this.analyser=null; }
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    return { audioBlob:blob, durationMs };
  },
};
function readAudioFile(file){
  return new Promise(res=>{
    const url = URL.createObjectURL(file);
    const a = document.createElement("audio"); a.preload = "metadata";
    a.onloadedmetadata = () => {
      const d = a.duration;
      res({ audioBlob:file, durationMs:isFinite(d)&&d>0?Math.round(d*1000):null, url });
    };
    a.onerror = () => res({ audioBlob:file, durationMs:null, url });
    a.src = url;
  });
}

const LiveSpeech = {
  rec:null, transcript:"",
  supported: !!(window.SpeechRecognition||window.webkitSpeechRecognition),
  start(onInterim){
    if(!this.supported) return false;
    const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    this.rec = new SR(); this.rec.continuous=true; this.rec.interimResults=true; this.rec.lang="en-US";
    this.transcript="";
    this.rec.onresult = (e)=>{ let fin="",interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin+=t+" "; else interim+=t; }
      if(fin) this.transcript+=fin; onInterim && onInterim((this.transcript+interim).trim()); };
    this.rec.onerror=()=>{};
    try{ this.rec.start(); return true; }catch(e){ return false; }
  },
  stop(){ if(this.rec){ try{ this.rec.stop(); }catch(e){} } return this.transcript.trim(); },
};
const BrowserSpeechProvider = {
  id:"browser-speech", liveOnly:true,
  async transcribe({ liveTranscript }){

};
// read an audio Blob as base64 (for sending to the transcribe function)
function blobToBase64(blob){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onloadend=()=>res(String(r.result).split(",")[1]||""); r.onerror=rej; r.readAsDataURL(blob); });
}
// PRODUCTION PATH: real transcription via the speaking-partner-ai function (Gemini)
const ApiTranscriptionProvider = {
  id:"api", liveOnly:false,
  async transcribe({ audioBlob }){
    if(!audioBlob) return { transcript:"", source:"Type / paste" };
    const audioBase64 = await blobToBase64(audioBlob);
    const data = await invokeSpeakingPartnerAI("transcribe", { audioBase64, mimeType: audioBlob.type || "audio/webm" });
    return { transcript:(data.transcript||"").trim(), source:"Gemini" };
  },
};
const Transcription = {
  provider: ApiTranscriptionProvider,   // Gemini via Edge Function (was BrowserSpeechProvider)
  isApi(){ return this.provider === ApiTranscriptionProvider; },
  async run({ inputSource, audioBlob, liveTranscript }){
    if(this.provider !== BrowserSpeechProvider){
      try{ const r = await this.provider.transcribe({ audioBlob, liveTranscript });
        if((r.transcript||"").trim()) return { transcript:r.transcript.trim(), source:r.source||"API", auto:true }; }
      catch(e){ /* fall through to manual / live */ }
    }
    if(inputSource==="mic" && (liveTranscript||"").trim()){
      const r = await BrowserSpeechProvider.transcribe({ liveTranscript });
      return { transcript:r.transcript, source:r.source, auto:true };
    }
    return { transcript:"", source:"Type / paste", auto:false };
  },
};

const FILLERS = ["um","uh","erm","umm","uhh","uhm","hmm","er","like","you know","i mean","kind of","sort of","kinda","sorta","basically"];
const Metrics = {
  compute(transcript, durationMs, targetSec){
    const clean = (transcript||"").toLowerCase();
    const words = clean.replace(/[^\w'\s]/g," ").split(/\s+/).filter(Boolean);
    const wordCount = words.length;
    const timeSec = durationMs ? Math.max(0.1, durationMs/1000) : null;
    const wpm = timeSec ? Math.round(wordCount/(timeSec/60)) : null;
    let fillerCount=0; const found={};
    let hay = " " + clean.replace(/[^\w'\s]/g," ").replace(/\s+/g," ") + " ";
    FILLERS.forEach(f=>{ const re = new RegExp("\\s"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s","g");
      const m = hay.match(re); if(m){ fillerCount+=m.length; found[f]=m.length; hay=hay.replace(re," "); } });
    const topFillers = Object.entries(found).sort((a,b)=>b[1]-a[1]).slice(0,4);
    let repetitions=0; for(let i=1;i<words.length;i++) if(words[i]===words[i-1] && words[i].length>1) repetitions++;
    return { wordCount, timeSec:timeSec?Math.round(timeSec):null, wpm, fillerCount, topFillers, repetitions,
      targetSec:targetSec||null, overBy: (targetSec&&timeSec)?Math.round(timeSec-targetSec):null };
  },
  mmss(s){ if(s==null||isNaN(s)) return "—"; const m=Math.floor(s/60), ss=Math.round(s%60); return m+":"+String(ss).padStart(2,"0"); },
};

/* =============================================================================

   ============================================================================= */
const dayKey = d => { const x=new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); };
function weekInfo(dates){
  const set=new Set(dates); const now=new Date(); now.setHours(0,0,0,0);
  const dow=(now.getDay()+6)%7; const monday=new Date(now); monday.setDate(now.getDate()-dow);
  const week=[];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i);
    week.push({ label:["M","T","W","T","F","S","S"][i], on:set.has(dayKey(d)), today:dayKey(d)===dayKey(now) }); }
  const daysThisWeek=week.filter(w=>w.on).length;
  let streak=0; const cur=new Date(now);
  if(!set.has(dayKey(cur))) cur.setDate(cur.getDate()-1);
  while(set.has(dayKey(cur))){ streak++; cur.setDate(cur.getDate()-1); }
  return { week, daysThisWeek, streak };
}

function Waveform({level, idle}){
  const BARS=27;
  const [bars,setBars]=useState(()=>Array(BARS).fill(4));
  const store=useRef(Array(BARS).fill(4));
  useEffect(()=>{
    if(idle){ setBars(Array(BARS).fill(4)); return; }
    store.current=store.current.slice(1).concat([4+level*72+Math.random()*10*level]);
    setBars([...store.current]);
  },[level,idle]);
  return html`<div className=${"wave"+(idle?" idle":"")} aria-hidden="true">
    ${bars.map((h,i)=>html`<i key=${i} style=${{height:Math.max(3,Math.min(84,h))+"px"}}/>`)}
  </div>`;
}

      }
      const m=session.a2?.metrics||session.a1.metrics;
      await recordPracticedToday({ date:Date.now(), topic:session.topic, fillers:m.fillerCount, wpm:m.wpm, time:m.timeSec, attempts:session.a2?2:1 });
      setSession(null); setScreen("home");
    }catch(e){ setErr("Couldn't save this practice to your account. Please try again."); }
  }

  if(!authReady) return html`<div className="app"><${Topbar}/><div className="analyzing"><p>Opening your practice space…</p></div></div>`;
  if(!user) return html`<${AuthScreen}/>`;

  if(screen==="home") return html`
    <div className="app screen">
      <${Topbar} onHistory=${()=>setScreen("history")} onSignOut=${signOut}/>
      <div className="eyebrow">Today's practice</div>
      <h1 className="greeting">Hi, ${
        editing
          ? html`<input className="editname" autoFocus defaultValue=${name}
              onBlur=${e=>{saveName(e.target.value.trim());setEditing(false);}}
              onKeyDown=${e=>{ if(e.key==="Enter"){ saveName(e.target.value.trim()); setEditing(false); } }}
              size=${Math.max(4,(name||"there").length)} />`
          : html`<span className="name" onClick=${()=>setEditing(true)} title="Click to set your name" style=${{cursor:"text"}}>${name||"there"}</span>`
      }.</h1>
      <p className="subhead">What do you want to practice today?</p>
      <div className="choices">
        <button className="choice" onClick=${()=>startTopic({mode:"random"})}>
          <span className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
          <span><h3>Random topic</h3><p>An unexpected prompt or professional scenario</p></span>
          <span className="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
        </button>
        <button className="choice" onClick=${()=>setScreen("choose")}>
          <span className="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg></span>
          <span><h3>Choose your practice</h3><p>Pick a goal, or bring your own topic</p></span>
          <span className="arr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg></span>
        </button>
      </div>
      <div className="week">
        <div className="week-top"><div className="eyebrow">This week</div>
          <div className="week-stats"><span>Streak <b>${streak}</b></span><span>Total <b>${total}</b></span></div></div>
        <div className="dots dotrow">
          ${week.map((d,i)=>html`<div key=${i} className=${"dot"+(d.on?" on":"")+(d.today?" today":"")}><span className="d">${d.label}</span></div>`)}
          <span style=${{marginLeft:"auto",fontFamily:"var(--mono)",fontSize:13,color:"var(--ink-2)",fontWeight:600}}>${daysThisWeek}/7</span>
        </div>
      </div>
      <div className="footnote">A companion between coaching sessions — not a replacement for your coach.</div>
    </div>`;

  if(screen==="choose") return html`<${ChooseScreen} onBack=${()=>setScreen("home")} onStart=${startTopic}/>`;

  if(screen==="prep" && session) return html`
    <div className="app screen">
      <${Topbar}/>
      <button className="back" onClick=${()=>setScreen(session.mode==="random"?"home":"choose")}><${IcBack}/> Back</button>
      <div className="card promptcard">
        <button className=${"reroll"+(loadingTopic?" spin":"")} onClick=${reroll} disabled=${loadingTopic} title="New topic" aria-label="New topic">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0114.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0020.5 15" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <div className="eyebrow">${session.goal?session.goal:"Your prompt"}</div>
        <p className="topic">${loadingTopic && !session.topic ? "Finding a good prompt…" : session.topic}</p>
      </div>
      ${session.framework && FRAMEWORKS[session.framework]
        ? html`<${FrameworkCard} fw=${session.framework} alt=${session.alt}
            onUseAlt=${()=>setSession(s=>({...s,framework:s.alt,alt:s.framework}))}/>` : null}
      ${err ? html`<div className="errbox">${err}</div>` : null}
      <button className="btn" style=${{marginTop:22}} disabled=${loadingTopic||!session.topic} onClick=${()=>setScreen("record")}>Start</button>
      <div className="footnote">The framework is optional. It's here if it helps — you're never marked down for skipping it.</div>
    </div>`;

  if(screen==="record" && session) return html`
    <${RecordScreen} session=${session} isRetry=${false}
      onBack=${()=>setScreen("prep")}
      onDone=${(t,d)=>analyzeAttempt({transcript:t,durationMs:d,isRetry:false})}/>`;

  if(screen==="record-2" && session) return html`
    <${RecordScreen} session=${session} isRetry=${true}
      retryFocus=${session.feedback.yourFocus} retryInstruction=${session.feedback.tryAgain}
      onBack=${()=>setScreen("feedback")}
      onDone=${(t,d)=>analyzeAttempt({transcript:t,durationMs:d,isRetry:true})}/>`;

  if(screen==="analyzing") return html`
    <div className="app screen"><${Topbar}/>
      <div className="analyzing"><div className="wave"><i/><i/><i/><i/><i/><i/><i/></div>
      <p>Listening to how you said it…</p></div></div>`;

  if(screen==="feedback" && session?.feedback) return html`
    <${FeedbackScreen} session=${session} err=${err}
      onRetry=${()=>setScreen("record-2")} onSave=${finishAndSave}/>`;

  if(screen==="retry" && session?.compare) return html`<${RetryScreen} session=${session} onSave=${finishAndSave}/>`;

  if(screen==="history") return html`
    <div className="app screen"><${Topbar}/>
      <button className="back" onClick=${()=>setScreen("home")}><${IcBack}/> Home</button>
      <h2 className="scr-title">Your practice</h2>
      <p className="scr-sub">${total} ${total===1?"session":"sessions"} · ${streak}-day streak</p>
      ${history.length===0
        ? html`<div className="empty">
            <div className="wave idle"><i style=${{height:8}}/><i style=${{height:20}}/><i style=${{height:34}}/><i style=${{height:16}}/><i style=${{height:8}}/></div>
            <h3>Nothing here yet</h3><p>Your saved sessions will show up here. Start one from home.</p></div>`
        : html`<div className="histlist">
            ${history.map((h,i)=>html`<div className="histitem" key=${i}>
              <span className="date">${new Date(h.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span>
              <span className="ht">${h.topic}</span>
              <span className="hm">${h.fillers}f · ${h.wpm??"—"}wpm · ${Metrics.mmss(h.time)}</span></div>`)}
          </div>`}
    </div>`;

  return html`<div className="app"><${Topbar}/></div>`;
}

/* ---- AUTH SCREEN ---- */
function AuthScreen(){
  const [mode,setMode]=useState("signin");
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const [error,setError]=useState("");
  async function submit(e){
    e.preventDefault(); setBusy(true); setMsg(""); setError("");
    try{
      if(mode==="signup"){
        const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:name.trim()}}});
        if(error) throw error;
        if(!data.session) setMsg("Check your email to confirm your account, then come back and sign in.");
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password}); if(error) throw error;
      }
    }catch(e){ setError(e.message||"Something went wrong."); }
    finally{ setBusy(false); }
  }
  return html`<div className="app screen"><div className="authwrap">
    <div className="brand"><${Mark}/><div><b>Beyond Words</b> <small>Speaking Partner</small></div></div>
    <form className="authcard" onSubmit=${submit}>
      <div className="eyebrow">Your practice space</div>
      <h1>${mode==="signin"?"Welcome back":"Create your account"}</h1>
      <p>${mode==="signin"?"Sign in to continue your speaking practice.":"Your streak and practice history will stay connected to this account."}</p>
      ${mode==="signup"?html`<div className="authfield"><label>Name</label><input required value=${name} onChange=${e=>setName(e.target.value)} autocomplete="name"/></div>`:null}
      <div className="authfield"><label>Email</label><input required type="email" value=${email} onChange=${e=>setEmail(e.target.value)} autocomplete="email"/></div>
      <div className="authfield"><label>Password</label><input required type="password" minlength="6" value=${password} onChange=${e=>setPassword(e.target.value)} autocomplete=${mode==="signin"?"current-password":"new-password"}/></div>
      ${error?html`<div className="errbox">${error}</div>`:null}
      ${msg?html`<div className="authmsg">${msg}</div>`:null}
      <button className="btn" style=${{marginTop:20}} disabled=${busy}>${busy?"Please wait…":mode==="signin"?"Sign in":"Create account"}</button>
      <div className="authswitch">${mode==="signin"?"New here? ":"Already have an account? "}<button type="button" onClick=${()=>{setMode(mode==="signin"?"signup":"signin");setError("");setMsg("");}}>${mode==="signin"?"Create account":"Sign in"}</button></div>
    </form>
  </div></div>`;
}

      <h2 className="scr-title">Choose your practice</h2>

      <div className="goalgrid">
        ${GOALS.map(([g])=>html`<button key=${g} className=${"goal"+(goal===g?" sel":"")} onClick=${()=>setGoal(g)}>
          <span className="gk"/><span><div>${g}</div></span></button>`)}
      </div>
      ${timed ? html`<div className="field" style=${{marginBottom:20}}>
        <label>How long do you want to speak?</label>
        <div className="timechips">
          ${[30,45,60,90].map(s=>html`<button key=${s} className=${"tchip"+(tsec===s?" sel":"")} onClick=${()=>setTsec(s)}>${s}s</button>`)}

/* ---- RECORD SCREEN ---- */
function RecordScreen({session,onBack,onDone,isRetry,retryFocus,retryInstruction}){
  const [state,setState]=useState("ready");
  const [inputSource,setInputSource]=useState("");
  const [level,setLevel]=useState(0);
  const [elapsed,setElapsed]=useState(0);
  const [live,setLive]=useState("");
  const [durationMs,setDurationMs]=useState(null);
  const [source,setSource]=useState("");
  const [autoFilled,setAutoFilled]=useState(false);
  const [audioUrl,setAudioUrl]=useState("");
  const [micBlocked,setMicBlocked]=useState(!MicSupport.hasApi());
  const [micReason,setMicReason]=useState(MicSupport.hasApi()?"":"This environment doesn't expose microphone access.");
  const [note,setNote]=useState("");
  const [working,setWorking]=useState(false);
  const timerRef=useRef(null);
  const fileRef=useRef(null);
  const target=session.targetSec;

  useEffect(()=>()=>{ clearInterval(timerRef.current); },[]);

  async function beginMic(){
    setNote(""); setLive(""); setElapsed(0); setAudioUrl("");
    try{
      await MicRecorder.start(lvl=>setLevel(lvl));
      LiveSpeech.start(txt=>setLive(txt));
      setInputSource("mic"); setState("live");
      const t0=performance.now();
      timerRef.current=setInterval(()=>setElapsed((performance.now()-t0)/1000),100);
    }catch(e){
      const map={ NotAllowedError:"Microphone permission is blocked in this environment.",
        SecurityError:"The runtime blocked microphone access (permissions policy).",
        NotFoundError:"No microphone was found.", NotReadableError:"The microphone is in use by something else." };
      setMicBlocked(true);
      setMicReason(map[e && e.name] || "Microphone capture isn't available here.");
    }
  }
  async function endMic(){
    clearInterval(timerRef.current);
    setWorking(true);
    // FIX: capture the recorded audio and send it for real transcription
    const { audioBlob:micBlob, durationMs:dur }=await MicRecorder.stop();
    const liveTxt=LiveSpeech.stop();
    const r=await Transcription.run({ inputSource:"mic", audioBlob:micBlob, liveTranscript:liveTxt });
    setDurationMs(dur); setLive(r.transcript); setSource(r.source); setAutoFilled(r.auto); setLevel(0);
    setWorking(false); setState("review");
  }
  async function onFile(e){
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    setNote(""); setWorking(true); setState("review");
    const { audioBlob, durationMs:dur, url }=await readAudioFile(file);
    setInputSource("upload"); setAudioUrl(url); setDurationMs(dur);
    const r=await Transcription.run({ inputSource:"upload", audioBlob, liveTranscript:"" });
    setLive(r.transcript); setSource(r.source); setAutoFilled(r.auto); setWorking(false);
  }
  function typeInstead(){
    setInputSource("typed"); setDurationMs(null); setAudioUrl("");
    setLive(""); setSource("Type / paste"); setAutoFilled(false); setState("review");
  }
  function analyze(){
    if(!live.trim()){ setNote("Add a few words of what you said so we can analyze it."); return; }
    onDone(live.trim(), durationMs);
  }

  const over = target && elapsed>target;

  return html`
    <div className="app screen">
      <${Topbar}/>
      <button className="back" onClick=${onBack}><${IcBack}/> Back</button>

      ${isRetry ? html`<div className="focuscard" style=${{marginBottom:20}}>
        <div className="eyebrow">Attempt 2 · your focus</div><p>${retryFocus}</p>
        ${retryInstruction ? html`<div style=${{marginTop:10,fontSize:13.5,color:"var(--ink-2)",lineHeight:1.5}}>${retryInstruction}</div>` : null}
      </div>` : null}

      <div className="rec-wrap">
        <p className="rec-topic">${session.topic}</p>
        ${target ? html`<div className="rec-target">target · ${target}s</div>` : null}

        ${state!=="review" ? html`<${Waveform} level=${level} idle=${state!=="live"}/>` : null}

        ${state==="live" ? html`
          <div className=${"timer"+(over?" over":"")}>${Metrics.mmss(elapsed)}</div>
          <div className="timer-sub">${target?`/ ${Metrics.mmss(target)}`:"recording"}</div>
          <button className="recbtn live" onClick=${endMic} aria-label="Stop recording"><span className="glyph"/></button>
          <div className="rec-hint">Tap to stop when you're done</div>
        ` : state==="ready" ? html`
          <div className="timer" style=${{color:"var(--ink-3)"}}>${target?Metrics.mmss(target):"0:00"}</div>
          <div className="timer-sub">${target?"aim for this":"take your time"}</div>

          <button className=${"recbtn"+(micBlocked?" disabled":"")} onClick=${micBlocked?undefined:beginMic}
            disabled=${micBlocked} aria-label="Record with microphone">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3z" fill="#fff"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
          <div className="rec-hint">${micBlocked ? "Microphone unavailable here" : "Tap to record"}</div>

          ${micBlocked ? html`<div className="capnote"><${IcInfo}/><span>${micReason} You can <b>upload an audio clip</b> instead — that's a fully supported way to practice here.</span></div>` : null}

          <div className="inputsplit">or</div>
          <div className="uploadwrap">
            <button className="btn sec" onClick=${()=>fileRef.current && fileRef.current.click()}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              Upload audio file
            </button>
            <input ref=${fileRef} className="hiddenfile" type="file"
              accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.webm,.flac" onChange=${onFile}/>
          </div>
          <div className="typelink"><button onClick=${typeInstead}>or type what you said</button></div>
        ` : null}
      </div>

      ${note ? html`<div className="errbox">${note}</div>` : null}

      ${state==="review" ? html`
        <div className="tx-panel">
          <div className="eyebrow">What you said ${source ? html`<span className="tx-src">${source}</span>` : null}</div>
          ${audioUrl ? html`<audio className="player" controls src=${audioUrl}></audio>` : null}
          <textarea className="tx" value=${live} onChange=${e=>setLive(e.target.value)}
            placeholder=${working ? "Transcribing your audio…" : autoFilled ? "Tidy anything the transcription misheard before analyzing." : "Type or paste what you said."}/>
          <div className="tx-help">
            <span style=${{fontFamily:"var(--mono)",color:"var(--ink-3)"}}>${durationMs?Metrics.mmss(durationMs/1000)+" of audio":"duration not read"}</span>
            ${working ? html` · transcribing with Gemini…` : null}
          </div>
        </div>
        <div className="btnrow">
          <button className="btn sec" onClick=${()=>{ setState("ready"); setLive(""); setAudioUrl(""); setInputSource(""); setNote(""); }}>Start over</button>
          <button className="btn" onClick=${analyze} disabled=${working}>${working?"Please wait…":"Analyze this"}</button>
        </div>
      ` : null}

      ${state==="ready" && !isRetry && session.framework && FRAMEWORKS[session.framework]
        ? html`<div className="footnote">Suggested shape if you want it: <b>${FRAMEWORKS[session.framework].full}</b></div>` : null}
    </div>`;
}

/* ---- FEEDBACK SCREEN ---- */
function FeedbackScreen({session,onRetry,onSave,err}){
  const m=session.a1.metrics, fb=session.feedback;
  const overNote = (m.targetSec && m.timeSec!=null)
    ? (m.overBy>4?`${Math.abs(m.overBy)}s over`:m.overBy<-4?`${Math.abs(m.overBy)}s under`:"on target") : null;
  return html`
    <div className="app screen">
      <${Topbar}/>
      <div className="eyebrow fb-head">Your speech</div>
      <p className="fb-topic">${session.topic}</p>
      <div className="metrics">
        <div className="metric"><div className="k">Fillers</div><div className="v">${m.fillerCount}</div>
          ${m.topFillers.length>0 ? html`<div className="fillerlist">${m.topFillers.map(([w,c])=>`${w}·${c}`).join("   ")}${m.repetitions?`   repeats·${m.repetitions}`:""}</div>` : null}</div>
        <div className="metric"><div className="k">Pace</div>
          <div className="v">${m.wpm!=null?m.wpm:"—"} <small>wpm</small></div>
          <div className="sub">${Metrics.mmss(m.timeSec)}${m.targetSec?` / ${Metrics.mmss(m.targetSec)}`:""}${overNote?` · ${overNote}`:""}</div></div>
        <div className="metric"><div className="k">Structure</div><div className="sub" style=${{marginTop:0}}>${fb.structure}</div></div>
        <div className="metric"><div className="k">Clarity</div><${ClarityLabel} label=${fb.clarityLabel}/><div className="sub">${fb.clarity}</div></div>
      </div>
      ${Array.isArray(fb.whatWorked) && fb.whatWorked.length>0 ? html`<div className="block">
        <div className="eyebrow">What worked</div>
        <ul className="worked">${fb.whatWorked.slice(0,2).map((w,i)=>html`<li key=${i}><${IcCheck}/>${w}</li>`)}</ul>
      </div>` : null}
      <div className="block"><div className="eyebrow">One pattern to notice</div>
        <p className="pattern">${fb.onePattern}</p>
        ${fb.whyItMatters ? html`<p className="why">${fb.whyItMatters}</p>` : null}</div>
      <div className="block">
        <div className="focuscard"><div className="eyebrow">Your focus</div><p>${fb.yourFocus}</p></div>
        ${fb.tryAgain ? html`<div className="tryagain"><div className="eyebrow">Try again</div><p>${fb.tryAgain}</p></div>` : null}
      </div>
      ${fb.coachNote && String(fb.coachNote).trim() ? html`<div className="coachnote"><${IcInfo}/><span>${fb.coachNote}</span></div>` : null}
      ${err ? html`<div className="errbox">${err}</div>` : null}
      <div className="btnrow">
        <button className="btn sec" onClick=${onSave}>Save & finish</button>
        <button className="btn" onClick=${onRetry}>Try again</button>
      </div>
    </div>`;
}

/* ---- RETRY RESULT ---- */
function RetryScreen({session,onSave}){
  const a=session.a1.metrics, b=session.a2.metrics, c=session.compare;
  const rows=[
    { k:"Fillers", from:a.fillerCount, to:b.fillerCount, better:b.fillerCount<a.fillerCount, eq:b.fillerCount===a.fillerCount, kind:"Fillers" },
    { k:"Pace", from:a.wpm??"—", to:(b.wpm??"—"), suffix:b.wpm!=null?" wpm":"", kind:"other" },
    { k:"Time", from:Metrics.mmss(a.timeSec), to:Metrics.mmss(b.timeSec), kind:"other" },
  ];
  const verdict=(c.verdict||"").split(/(\*[^*]+\*)/).map((p,i)=>
    p.startsWith("*")&&p.endsWith("*") ? html`<em key=${i}>${p.slice(1,-1)}</em>` : html`<span key=${i}>${p}</span>`);
  return html`
    <div className="app screen">
      <${Topbar}/>
      <div className="eyebrow fb-head">Your progress</div>
      <p className="verdict">${verdict}</p>
      <div className="prog">
        ${rows.map((r,i)=>html`<div className="progrow" key=${i}>
          <span className="pk">${r.k}</span>
          <span className="pv"><span className="from">${r.from}</span><span className="arr">→</span><span className="to">${r.to}${r.suffix||""}</span></span>
          <span className=${"tag "+(r.kind==="Fillers"&&r.better?"tag-up":"tag-flat")}>${r.kind==="Fillers"?(r.better?"improved":r.eq?"held":"—"):"—"}</span>
        </div>`)}
        <div className="qualrow"><div className="pk">Structure</div><p>${c.structure}</p></div>
        <div className="qualrow"><div className="pk">Clarity</div><p style=${{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>${c.clarity} <${ClarityLabel} label=${c.clarityLabel}/></p></div>
      </div>
      <button className="btn" style=${{marginTop:22}} onClick=${onSave}>Save & finish</button>
      <div className="footnote">The retry only tests the one focus — no new corrections piled on.</div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
